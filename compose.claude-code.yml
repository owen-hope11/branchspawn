services:
  claude-code:
    container_name: ${CONTAINER_NAME:-claude-code}
    image: node:20-bookworm-slim
    working_dir: /workspace
    entrypoint: /bin/sh
    command:
      - -c
      - |
        if ! command -v claude >/dev/null 2>&1; then
          echo "Installing Claude Code..."
          npm install -g @anthropic-ai/claude-code
        fi
        echo "Claude Code container ready."
        sleep infinity
    stdin_open: true
    tty: true
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    volumes:
      - ${PROJECT_DIR:-.}:/workspace
      - claude-code-node-modules:/usr/local/lib/node_modules
    healthcheck:
      test: ["CMD-SHELL", "command -v claude || exit 1"]
      interval: 10s
      timeout: 30s
      retries: 10
      start_period: 60s
    restart: unless-stopped

volumes:
  claude-code-node-modules:
    name: claude-code-modules-${CONTAINER_NAME:-main}
    driver: local